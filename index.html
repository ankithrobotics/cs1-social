
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS1 – Learn. Share. Grow.</title>
<style>
:root{--bg:#f7f6fb;--card:#fff;--tx:#17142b;--mu:#6b6882;--ln:#e6e3f1;--ac:#5b3df5;--ac2:#2f7bff;--sh:0 2px 14px rgba(40,30,110,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0f0d1a;--card:#1a1730;--tx:#f1effc;--mu:#9a96b8;--ln:#2c2850;--sh:0 2px 14px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ac);text-decoration:none;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
.ac{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.btn{padding:9px 18px;border-radius:12px;font-weight:600;transition:transform .15s}.btn:active{transform:scale(.96)}
.btn.o{border:1px solid var(--ln);background:var(--card)}.btn.r{background:#e5384f;color:#fff}
.btn.s{padding:6px 14px;font-size:13px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--ln);background:var(--card);margin:5px 0 10px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.lay{display:flex;min-height:100vh}
.side{width:230px;padding:22px 14px;border-right:1px solid var(--ln);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.side .n{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;font-weight:600;text-align:left;width:100%}
.side .n:hover,.side .n.on{background:var(--bg);color:var(--ac)}
.main{flex:1;max-width:680px;margin:0 auto;padding:22px 14px 90px;width:100%}
.bot{display:none}
@media(max-width:800px){.side{display:none}.bot{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:20}.bot button{font-size:22px;padding:6px 12px;position:relative}.bot button.on{color:var(--ac)}.main{padding-top:12px}}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);margin-bottom:20px;overflow:hidden}
.pad{padding:14px 16px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mu{color:var(--mu);font-size:13px}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;background-size:cover;background-position:center}
.av.l{width:84px;height:84px;font-size:32px}
.car{position:relative;background:#000}
.trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.trk::-webkit-scrollbar{display:none}
.trk img{flex:none;width:100%;max-height:560px;object-fit:contain;scroll-snap-align:center;cursor:zoom-in;background:#111}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:2px 10px;font-size:12px}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);color:#000;font-size:18px}
.arr.p{left:8px}.arr.n{right:8px}
@media(hover:none){.arr{display:none}}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--bg);color:var(--ac);font-size:12px;font-weight:600;margin-right:6px}
.act button{font-size:22px;padding:4px 8px}.act .on{color:#e5384f}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid .g{aspect-ratio:1;background-size:cover;background-position:center;border-radius:6px;position:relative;cursor:pointer}
.g i{position:absolute;top:6px;right:6px;font-style:normal;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:0 6px;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--card);white-space:nowrap;font-size:13px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(10,8,30,.6);z-index:50;display:grid;place-items:center;padding:14px;animation:f .2s}
@keyframes f{from{opacity:0}}
.md{background:var(--card);border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:20px}
.lb{position:fixed;inset:0;background:#000;z-index:60;overflow:auto;display:flex}.lb img{margin:auto;max-width:100%;max-height:100vh;cursor:zoom-in}.lb.z img{max-width:none;max-height:none;width:220%;cursor:zoom-out}
.pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin:8px 0}
.pv div{position:relative;aspect-ratio:1;background-size:cover;background-position:center;border-radius:10px}
.pv button{position:absolute;bottom:3px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;width:24px;height:22px;font-size:12px}
.pv .x{top:3px;right:3px;bottom:auto}.pv .l{left:3px}.pv .rr{left:30px}
.bar{height:6px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
.err{color:#e5384f;font-size:13px;min-height:18px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:80;font-size:14px}
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(91,61,245,.18),transparent 50%),radial-gradient(circle at 85% 90%,rgba(47,123,255,.18),transparent 50%)}
.hero h1{font-size:clamp(40px,9vw,76px);letter-spacing:-2px}.auth{max-width:380px;margin:8vh auto;padding:14px}
.cm{display:flex;gap:8px;align-items:baseline;font-size:14px;margin:4px 0}
.dot{position:absolute;top:2px;right:6px;background:#e5384f;color:#fff;border-radius:10px;font-size:10px;padding:0 5px}
.demo{background:var(--bg);border:1px dashed var(--ln);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--mu);margin-bottom:14px}
</style></head><body>
<div id="app"></div><div id="ov"></div><div id="tt"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUBJ=["Computer Science","Mathematics","Physics","Chemistry","Biology","English","Other"],TYPES=["Assignment","Homework","Notes","Project","Question"];
const CLOUDINARY_NAME="y7wyblqg",CLOUDINARY_PRESET="cs1_uploads";
const COL=["#5b3df5","#2f7bff","#e5384f","#0fa37f","#e08a00","#b13fd1"];
const hash=s=>{let h=5381;for(const c of s)h=(h*33+c.charCodeAt(0))>>>0;return h.toString(36)};
const note=(t,lines,c)=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='800' height='800'><rect width='800' height='800' fill='#fffdf5'/>${[...Array(14)].map((_,i)=>`<line x1='40' x2='760' y1='${150+i*46}' y2='${150+i*46}' stroke='#c9d7f5'/>`).join("")}<line x1='90' x2='90' y1='0' y2='800' stroke='#f2a3a3'/><text x='110' y='95' font-family='cursive' font-size='44' font-weight='bold' fill='${c}'>${t}</text>${lines.map((l,i)=>`<text x='110' y='${190+i*46}' font-family='cursive' font-size='30' fill='#2a3a6a'>${l}</text>`).join("")}</svg>`);
let D,V={n:"landing"},busy={},pg=1,filt={s:"",t:"",q:""};
function seed(){const m=(u,d,b,c,cl)=>({id:u,username:u,display:d,bio:b,cls:c,school:"",email:u+"@demo.cs1",pw:hash("demo1234"),col:cl,pic:"",follow:[]});
const us=[m("ana_codes","Ana Rivera","Loves recursion and coffee.","Grade 11",COL[0]),m("ravi.math","Ravi Menon","Calculus notes, neatly.","Grade 12",COL[1]),m("mei_bio","Mei Tanaka","Cells, cells, cells.","Grade 10",COL[3])];
const p=(i,u,imgs,cap,s,t,tags,h)=>({id:"p"+i,user:u,imgs,cap,subj:s,type:t,tags,t:Date.now()-h*36e5,likes:[],comments:[],saved:[]});
return{users:us,posts:[p(1,"ana_codes",[note("Recursion basics",["base case first!","fib(n)=fib(n-1)+fib(n-2)","watch the stack depth"],"#5b3df5"),note("Big-O cheat",["O(1) < O(log n)","< O(n) < O(n log n)","< O(n^2)"],"#5b3df5")],"My CS notes from today’s lecture. Swipe for the Big-O sheet!","Computer Science","Notes",["recursion","bigO"],2),
p(2,"ravi.math",[note("Derivatives",["d/dx x^n = n x^(n-1)","chain rule: f'(g)*g'","product rule too"],"#2f7bff"),note("Practice set 4",["1) d/dx sin(2x)","2) d/dx x*e^x","3) d/dx ln(x^2)"],"#2f7bff")],"Can anyone check my answers for set 4?","Mathematics","Question",["calculus","help"],5),
p(3,"mei_bio",[note("Mitosis stages",["Prophase","Metaphase","Anaphase","Telophase"],"#0fa37f"),note("Cell diagram",["nucleus, ribosome","mitochondria = power","membrane"],"#0fa37f")],"Biology homework done. Hope it helps your revision!","Biology","Homework",["cells","revision"],9)],notifs:[],session:null,theme:matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"}}
try{D=JSON.parse(localStorage.getItem("cs1"))}catch(e){}
D=D&&D.users?D:seed();
const save=()=>{try{localStorage.setItem("cs1",JSON.stringify(D));return true}catch(e){toast("Storage is full. Delete a post or use smaller photos.");return false}};
const me=()=>D.users.find(u=>u.id===D.session),usr=n=>D.users.find(u=>u.username===n),post=i=>D.posts.find(p=>p.id===i);

async function api(path,opts={}){const token=localStorage.getItem("cs1_token"),headers={"Content-Type":"application/json",...(opts.headers||{})};if(token)headers.Authorization="Bearer "+token;const r=await fetch(path,{...opts,headers});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||"Could not connect to CS1.");return data}
async function refreshShared(){const token=localStorage.getItem("cs1_token");if(!token)return;const [ur,pr]=await Promise.all([api("/api/users"),api("/api/posts")]);const users=ur.users||[];D.users=users.map((u,i)=>({id:u.id,username:u.username,display:u.display_name||u.username,bio:u.bio||"",cls:"",school:"",email:u.email||"",pw:"",col:COL[i%COL.length],pic:u.avatar_url||"",follow:[]}));const current=me();if(current){current.follow=users.filter(u=>u.following).map(u=>u.id)}D.posts=(pr.posts||[]).map(p=>({id:String(p.id),user:p.user,imgs:p.imgs||[],cap:p.cap||"",subj:p.subj||"Other",type:p.type||"Question",tags:p.tags||[],t:p.t||Date.now(),likes:p.likes||[],comments:p.comments||[],saved:p.saved||[]}));}

document.documentElement.dataset.theme=D.theme;
function toast(m){const t=$("#tt");t.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML="",2400)}
function ago(t){const s=(Date.now()-t)/1000;return s<60?"just now":s<3600?Math.floor(s/60)+" min ago":s<86400?Math.floor(s/3600)+" h ago":new Date(t).toLocaleDateString()}
const av=(u,c="")=>u?`<div class="av ${c}" style="background-color:${u.col};${u.pic?`background-image:url(${u.pic})`:""}">${u.pic?"":esc(u.display[0]||"?").toUpperCase()}</div>`:"";
const logo=(s=36)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-label="CS1"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b3df5"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#lg)"/><path d="M9 14h13M9 14v12h13M26 14h8M30 14v12M26 26h8" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function go(n,a){V={n,a};pg=1;scrollTo(0,0);render()}
function ntf(to,type,pid){const u=me();if(to===u.id)return;D.notifs.push({id:Date.now()+Math.random(),to,from:u.id,type,pid,t:Date.now(),read:false})}
function render(){const u=me(),a=$("#app"),n=V.n;
if(!u&&!["landing","signup","login","reset"].includes(n)){V={n:"landing"};return render()}
if(n==="landing")return a.innerHTML=`<div class="hero"><div>${logo(72)}<h1 style="margin-top:14px">CS1</h1><p style="font-size:22px;margin:8px 0 6px"><b>Learn. Share. Grow.</b></p><p class="mu" style="max-width:420px;margin:0 auto 24px">Share your assignments, questions and ideas with students on one shared feed.</p><button class="btn ac" data-a="go" data-n="signup">Create account</button> <button class="btn o" data-a="go" data-n="login">Log in</button></div></div>`;
if(["signup","login","reset"].includes(n))return a.innerHTML=authV(n);
const nu=D.notifs.filter(x=>x.to===u.id&&!x.read).length;
const nav=[["home","🏠","Home"],["explore","🔍","Explore"],["create","➕","Create Post"],["notifs","🔔","Notifications"],["saved","🔖","Saved Posts"],["profile","👤","Profile"],["settings","⚙️","Settings"]];
const bn=[["home","🏠"],["explore","🔍"],["create","➕"],["notifs","🔔"],["profile","👤"]];
const on=k=>k===n||(k==="profile"&&n==="user"&&V.a===u.username);
let body={home:homeV,explore:expV,post:postV,user:profV,profile:()=>profV(u.username),notifs:notV,saved:savV,settings:setV}[n];
a.innerHTML=`<div class="lay"><nav class="side"><div class="row" style="padding:6px 12px 18px">${logo(34)}<h2>CS1</h2></div>${nav.map(([k,i,l])=>`<button class="n ${on(k)?"on":""}" data-a="nav" data-n="${k}">${i} ${l}${k==="notifs"&&nu?` <span class="dot" style="position:static">${nu}</span>`:""}</button>`).join("")}</nav><main class="main">${body?body():nf()}</main></div><nav class="bot">${bn.map(([k,i])=>`<button class="${on(k)?"on":""}" aria-label="${k}" data-a="nav" data-n="${k}">${i}${k==="notifs"&&nu?`<span class="dot">${nu}</span>`:""}</button>`).join("")}</nav>`;
const s=$("#sen");if(s)new IntersectionObserver(e=>{if(e[0].isIntersecting){pg++;render()}}).observe(s)}
const nf=()=>`<div style="text-align:center;padding:60px 0"><h1 style="font-size:72px">404</h1><p class="mu">This page doesn’t exist, or the post was deleted.</p><button class="btn ac" data-a="nav" data-n="home">Back to home</button></div>`;
function authV(n){const t={signup:"Create your account",login:"Welcome back",reset:"Reset password"}[n];return`<div class="auth"><div class="row" style="justify-content:center;margin-bottom:12px">${logo(40)}<h2>CS1</h2></div><div class="card pad"><h2 style="margin-bottom:10px">${t}</h2><div class="demo">Your account and shared posts are saved online.</div><form id="af" data-k="${n}">${n==="signup"?`<label>Username<input name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username"></label><label>Email<input name="email" type="email" required></label>`:`<label>${n==="login"?"Username or email":"Email"}<input name="id" required></label>`}<label>${n==="reset"?"New password":"Password"}<input name="pw" type="password" required minlength="8" autocomplete="${n==="login"?"current-password":"new-password"}"></label><div class="err" id="er"></div><button class="btn ac" style="width:100%">${{signup:"Sign up",login:"Log in",reset:"Save new password"}[n]}</button></form><p class="mu" style="text-align:center;margin-bottom:0">${n==="login"?`<a data-a="go" data-n="reset">Forgot password?</a> · <a data-a="go" data-n="signup">Sign up</a>`:`<a data-a="go" data-n="login">I have an account</a>`}</p></div></div>`}
function card(p,det){const u=usr(p.user),m=me(),L=p.likes.includes(m.id),S=p.saved.includes(m.id);
return`<article class="card" id="c${p.id}"><div class="pad row"><a data-a="user" data-u="${esc(u.username)}" class="row" style="color:inherit">${av(u)}<div><b>${esc(u.username)}</b><div class="mu">${ago(p.t)}</div></div></a><span class="sp"></span><button data-a="menu" data-id="${p.id}" aria-label="More">⋯</button></div>${p.imgs.length?`<div class="car"><div class="trk" data-id="${p.id}">${p.imgs.map((s,i)=>`<img src="${s}" alt="Photo ${i+1} of ${p.imgs.length}" data-a="zoom" data-s="${p.id}:${i}">`).join("")}</div>${p.imgs.length>1?`<div class="cnt" id="ct${p.id}">1/${p.imgs.length}</div><button class="arr p" data-a="sl" data-id="${p.id}" data-d="-1" aria-label="Previous">‹</button><button class="arr n" data-a="sl" data-id="${p.id}" data-d="1" aria-label="Next">›</button>`:""}</div>`:`<div style="padding:22px 18px;background:var(--bg);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px">${esc(p.cap)}</div>`}<div class="pad"><div class="row act"><button class="${L?"on":""}" data-a="like" data-id="${p.id}" aria-label="Like">${L?"❤️":"🤍"}</button><button data-a="post" data-id="${p.id}" aria-label="Comments">💬</button><button data-a="share" data-id="${p.id}" aria-label="Share">🔗</button><span class="sp"></span><button class="${S?"on":""}" data-a="sv" data-id="${p.id}" aria-label="Save">${S?"🔖":"📑"}</button></div><div><b>${p.likes.length} likes</b></div><div style="margin:6px 0"><span class="tag">${esc(p.subj)}</span><span class="tag">${esc(p.type)}</span></div>${p.imgs.length?`<div><b>${esc(u.username)}</b> ${esc(p.cap)} ${p.tags.map(t=>`<a data-a="tag" data-t="${esc(t)}">#${esc(t)}</a>`).join(" ")}</div>`:`<div>${p.tags.map(t=>`<a data-a="tag" data-t="${esc(t)}">#${esc(t)}</a>`).join(" ")}</div>`}${det?cmts(p):`<a class="mu" data-a="post" data-id="${p.id}">${p.comments.length?`View all ${p.comments.length} comments`:"Add a comment"}</a>`}</div></article>`}
function cmts(p){const m=me();return`<div style="margin-top:10px">${p.comments.map(c=>{const cu=usr(c.user)||{username:"deleted"};return`<div class="cm"><b>${esc(cu.username)}</b><span class="sp">${esc(c.text)}</span>${c.user===m.username?`<button class="mu" data-a="dcm" data-id="${p.id}" data-c="${c.id}">Delete</button>`:""}</div>`}).join("")||`<p class="mu">No comments yet. Start the conversation.</p>`}<form class="row" data-k="cm" data-id="${p.id}"><input name="t" placeholder="Add a comment…" maxlength="300" required style="margin:8px 0"><button class="btn ac s">Post</button></form></div>`}
function homeV(){const m=me(),all=[...D.posts].sort((a,b)=>b.t-a.t),sl=all.slice(0,pg*4);return`${sl.map(p=>card(p)).join("")||`<div class="card pad" style="text-align:center">No posts yet. Share your first notes.<br><br><button class="btn ac" data-a="nav" data-n="create">Create Post</button></div>`}${sl.length<all.length?`<div id="sen" class="mu" style="text-align:center">Loading more…</div>`:`<p class="mu" style="text-align:center">You’re all caught up.</p>`}<button class="btn ac" data-a="nav" data-n="create" style="position:fixed;right:18px;bottom:84px;border-radius:30px;box-shadow:var(--sh)">+ Create Post</button>`}
function expV(){const q=filt.q.toLowerCase().replace(/^#/,""),tc={};D.posts.forEach(p=>p.tags.forEach(t=>tc[t]=(tc[t]||0)+1));
let ps=D.posts.filter(p=>(!filt.s||p.subj===filt.s)&&(!filt.t||p.type===filt.t)&&(!q||(p.cap+" "+p.user+" "+p.tags.join(" ")).toLowerCase().includes(q)));
const us=q?D.users.filter(u=>(u.username+u.display).toLowerCase().includes(q)):[];
ps=[...ps].sort((a,b)=>b.likes.length-a.likes.length||b.t-a.t);
const ch=(arr,k)=>`<div class="chips">${["",...arr].map(x=>`<button class="chip ${filt[k]===x?"on":""}" data-a="f" data-k="${k}" data-v="${esc(x)}">${x||"All"}</button>`).join("")}</div>`;
return`<input id="sq" type="search" placeholder="Search users, posts, hashtags" value="${esc(filt.q)}">${ch(SUBJ,"s")}${ch(TYPES,"t")}<div class="chips">${Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([t])=>`<a class="chip" data-a="tag" data-t="${esc(t)}">#${esc(t)}</a>`).join("")}</div>${us.map(u=>`<a data-a="user" data-u="${esc(u.username)}" class="row card pad" style="color:inherit">${av(u)}<div><b>${esc(u.username)}</b><div class="mu">${esc(u.display)}</div></div></a>`).join("")}${grid(ps)||`<p class="mu">No matching posts. Try another filter.</p>`}`}

function pvr(){

function comp(f,max,q){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onerror=()=>no();
    r.onload=()=>{
      const im=new Image();
      im.onerror=()=>no();
      im.onload=()=>{
        const k=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement("canvas");
        c.width=im.width*k;
        c.height=im.height*k;
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        ok(c.toDataURL("image/jpeg",q));
      };
      im.src=r.result;
    };
    r.readAsDataURL(f);
  });
}

async function addFiles(fs){
  const er=$("#er");
  if(!er)return;
  er.textContent="";
  draft=[];
  const b=$("#pb");
  if(fs.length>10){
    er.textContent="Choose no more than 10 photos.";
    return;
  }
  for(let i=0;i<fs.length;i++){
    const f=fs[i];
    if(!/^image\/(jpeg|png|webp)$/.test(f.type)){
      er.textContent=`${f.name} isn’t a JPG, PNG or WebP image.`;
      continue;
    }
    if(f.size>12*1024*1024){
      er.textContent=`${f.name} is too large (max 12 MB each).`;
      continue;
    }
    try{
      draft.push(await comp(f,1400,.82));
    }catch(e){
      er.textContent=`Couldn’t read ${f.name}.`;
    }
    if(b)b.style.width=((i+1)/fs.length*100)+"%";
    pvr();
  }
  if(b)setTimeout(()=>{b.style.width=0},600);
  if(draft.length<2)er.textContent="Choose at least 2 valid photos.";
}

async function uploadDraftImages(){
  const urls=[];
  const er=$("#er");
  for(let i=0;i<draft.length;i++){
    if(er)er.textContent=`Uploading photo ${i+1} of ${draft.length}…`;
    const fd=new FormData();
    fd.append("file",draft[i]);
    fd.append("upload_preset",CLOUDINARY_PRESET);
    const r=await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_NAME}/image/upload`,
      {method:"POST",body:fd}
    );
    let out={};
    try{out=await r.json()}catch{}
    if(!r.ok||!out.secure_url)
      throw new Error(out.error?.message||`Photo ${i+1} failed to upload.`);
    urls.push(out.secure_url);
    const b=$("#pb");
    if(b)b.style.width=Math.round((i+1)/draft.length*100)+"%";
  }
  return urls;
}

document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target,k=f.dataset.k,d=Object.fromEntries(new FormData(f)),er=$("#er");
  const E=m=>{if(er)er.textContent=m};

  if(k==="signup"||k==="login"){
    const submit=f.querySelector('button[type="submit"],button:not([type])');
    if(submit){
      submit.disabled=true;
      submit.textContent=k==="signup"?"Creating account…":"Logging in…";
    }
    try{
      const payload=k==="signup"
        ? {username:d.username.trim(),display_name:d.username.trim(),email:d.email.trim().toLowerCase(),password:d.pw}
        : {login:d.id.trim().toLowerCase(),password:d.pw};
      const response=await fetch(`/api/${k==="signup"?"register":"login"}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
      const result=await response.json();
      if(!response.ok)throw new Error(result.error||"Could not connect to your account.");
      localStorage.setItem("cs1_token",result.token);
      const u=result.user;
      const localUser={
        id:u.id,username:u.username,display:u.display_name||u.username,
        bio:u.bio||"",cls:"",school:"",email:u.email||"",pw:"",
        col:COL[D.users.length%6],pic:u.avatar_url||"",follow:[]
      };
      D.users=D.users.filter(x=>x.id!==u.id&&x.username!==u.username);
      D.users.push(localUser);
      D.session=u.id;
      save();
      await refreshShared();
      go("home");
    }catch(err){
      E(err.message||"Something went wrong. Please try again.");
    }finally{
      if(submit){
        submit.disabled=false;
        submit.textContent=k==="signup"?"Sign up":"Log in";
      }
    }
    return;
  }

  if(k==="reset"){
    return E("Password reset is not connected yet. Please contact the site owner for help.");
  }

  if(k==="cm"){
    const t=d.t.trim();
    if(!t)return;
    try{
      await api(`/api/posts/${f.dataset.id}/comments`,{
        method:"POST",body:JSON.stringify({content:t})
      });
      await refreshShared();
      render();
    }catch(err){toast(err.message)}
  }

  if(k==="prof"){
    try{
      await api("/api/profile",{
        method:"POST",
        body:JSON.stringify({display_name:d.display.trim(),bio:d.bio.trim()})
      });
      await refreshShared();
      render();
      toast("Profile saved");
    }catch(err){E(err.message)}
  }

  if(k==="np"){
    if(!d.cap.trim())return E("Write a caption before publishing.");
    if(draft.length<2||draft.length>10)return E("Add between 2 and 10 photos.");
    if(busy.p&&Date.now()-busy.p<3000)return E("Please wait a few seconds before posting again.");
    const submit=f.querySelector("#pub");
    if(submit){submit.disabled=true;submit.textContent="Uploading…"}
    try{
      const imgs=await uploadDraftImages();
      if(er)er.textContent="Saving post…";
      await api("/api/posts",{
        method:"POST",
        body:JSON.stringify({
          caption:d.cap.trim(),subject:d.subj,post_type:d.type,
          tags:d.tags||"",imgs
        })
      });
      busy.p=Date.now();
      await refreshShared();
      close();
      go("home");
      toast("Published with photos!");
    }catch(err){
      E(err.message||"Upload failed. Please try again.");
    }finally{
      if(submit){submit.disabled=false;submit.textContent="Publish"}
    }
  }
});

    return go(d.n);
  }

  if(a==="user")return go("user",d.u);
  if(a==="post"){
    close();
    return go("post",d.id);
  }

  if(a==="tag"){
    filt={s:"",t:"",q:"#"+d.t};
    return go("explore");
  }

  if(a==="f"){
    filt[d.k]=d.v;
    return render();
  }

  if(a==="sl"){
    const t=document.querySelector(`.trk[data-id="${d.id}"]`);
    if(t)t.scrollBy({left:t.clientWidth*Number(d.d),behavior:"smooth"});
    return;
  }

  if(a==="zoom"){
    const [i,n]=d.s.split(":");
    const p=post(i);
    if(!p)return;
    $("#ov").insertAdjacentHTML(
      "beforeend",
      `<div class="lb" data-a="lb"><img src="${p.imgs[n]}" alt="Zoomed photo"></div>`
    );
    return;
  }

  if(a==="lb"){
    if(e.target.tagName==="IMG")return el.classList.toggle("z");
    return el.remove();
  }

  if(a==="like"){
    api(`/api/posts/${d.id}/like`,{method:"POST"})
      .then(()=>refreshShared())
      .then(render)
      .catch(err=>toast(err.message));
    return;
  }

  if(a==="sv"){
    api(`/api/posts/${d.id}/bookmark`,{method:"POST"})
      .then(()=>refreshShared())
      .then(()=>{toast("Bookmarks updated");render()})
      .catch(err=>toast(err.message));
    return;
  }

  if(a==="share"){
    const u=location.href.split("#")[0];
    if(navigator.clipboard){
      navigator.clipboard.writeText(u)
        .then(()=>toast("Link copied"))
        .catch(()=>toast("Copy this page’s address to share it"));
    }else{
      toast("Copy this page’s address to share it");
    }
    return;
  }

  if(a==="dcm"){
    api(`/api/comments/${d.c}`,{method:"DELETE"})
      .then(()=>refreshShared())
      .then(render)
      .catch(err=>toast(err.message));
    return;
  }

  if(a==="menu"){
    const p=post(d.id);
    if(!p)return;
    return modal(`<h3>Post options</h3>
      <div class="row" style="flex-direction:column;align-items:stretch;margin-top:12px">
      ${p.user===m.username
        ?`<button class="btn r" data-a="dp" data-id="${p.id}">Delete post</button>`
        :`<button class="btn o" data-a="rp" data-id="${p.id}">Report post</button>`}
      <button class="btn o" data-a="close">Cancel</button>
      </div>`);
  }

  if(a==="dp"){
    return confirmD("Delete this post?","This can’t be undone.",async()=>{
      try{
        await api(`/api/posts/${d.id}`,{method:"DELETE"});
        await refreshShared();
        go("home");
        toast("Post deleted");
      }catch(err){toast(err.message)}
    });
  }

  if(a==="rp"){
    close();
    return toast("Reported. Thanks for keeping CS1 safe.");
  }

  if(a==="fw"){
    const u=usr(d.u);
    if(!u)return;
    api(`/api/users/${u.id}/follow`,{method:"POST"})
      .then(()=>refreshShared())
      .then(render)
      .catch(err=>toast(err.message));
    return;
  }

  if(a==="fl"){
    const u=usr(d.u);
    if(!u)return;
    const l=d.k==="ers"
      ?D.users.filter(x=>x.follow.includes(u.id))
      :u.follow.map(id=>D.users.find(x=>x.id===id)).filter(Boolean);

    return modal(`<h3>${d.k==="ers"?"Followers":"Following"}</h3>
      ${l.map(x=>`<a class="row" style="margin:10px 0;color:inherit" data-a="user" data-u="${esc(x.username)}">${av(x)}<b>${esc(x.username)}</b></a>`).join("")||`<p class="mu">No one yet.</p>`}`);
  }

  if(a==="rm"){
    draft.splice(+d.i,1);
    return pvr();
  }

  if(a==="mv"){
    const i=+d.i,j=i+Number(d.d);
    if(j<0||j>=draft.length)return;
    [draft[i],draft[j]]=[draft[j],draft[i]];
    return pvr();
  }

  if(a==="theme"){
    D.theme=D.theme==="dark"?"light":"dark";
    document.documentElement.dataset.theme=D.theme;
    save();
    return render();
  }

  if(a==="logout"){
    return confirmD("Log out?","You can log back in any time.",async()=>{
      const token=localStorage.getItem("cs1_token");
      try{
        if(token)await fetch("/api/logout",{
          method:"POST",
          headers:{Authorization:"Bearer "+token}
        });
      }catch{}
      localStorage.removeItem("cs1_token");
      D.session=null;
      save();
      go("landing");
    });
  }

  if(a==="del"){
    return confirmD("Delete your account?","Your profile, posts and comments will be removed permanently.",async()=>{
      try{
        await api("/api/account",{method:"DELETE"});
        localStorage.removeItem("cs1_token");
        D.session=null;
        D.posts=[];
        D.users=[];
        go("landing");
        toast("Account deleted");
      }catch(err){toast(err.message)}
    });
  }
});

async function restoreOnlineSession(){
  const token=localStorage.getItem("cs1_token");
  if(!token){
    D.session=null;
    render();
    return;
  }

  try{
    const response=await fetch("/api/me",{
      headers:{Authorization:"Bearer "+token}
    });
    const result=await response.json();

    if(!response.ok||!result.user)throw new Error("Session expired");

    const u=result.user;
    const localUser={
      id:u.id,
      username:u.username,
      display:u.display_name||u.username,
      bio:u.bio||"",
      cls:"",
      school:"",
      email:u.email||"",
      pw:"",
      col:COL[D.users.length%COL.length],
      pic:u.avatar_url||"",
      follow:[]
    };

    D.users=D.users.filter(x=>x.id!==u.id&&x.username!==u.username);
    D.users.push(localUser);
    D.session=u.id;
    save();
    V={n:"home"};
    await refreshShared();
  }catch{
    localStorage.removeItem("cs1_token");
    D.session=null;
    save();
  }

  render();
}

restoreOnlineSession();
